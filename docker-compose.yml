services:
  # 1. ローカルEVMノード (Ubuntu上のAnvil)
  toku-evm:
    build: .
    container_name: toku-evm
    command: anvil --host 0.0.0.0 --port 8545 --block-time 1
    ports:
      - "8545:8545"

  # 2. 拡散シミュレーター & AI連携ノード (Ubuntu)
  toku-app:
    build: .
    container_name: toku-app
    command: uvicorn server:app --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"  # API用ポートを追加
    depends_on:
      - toku-evm
    environment:
      - RPC_URL=http://toku-evm:8545
      # Macホスト側で動作するOllama (Metal GPU) へ接続
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true
